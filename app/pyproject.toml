[project]
name = "evchargeops"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6",
    "pandas>=3.0.5",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.0",
    "statsmodels>=0.14.6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "chargeops.settings"
python_files = ["test_*.py", "tests.py"]
addopts = "-q --strict-markers"
testpaths = ["core", "billing", "ingestion", "intelligence", "portal"]
markers = [
    "slow: teste que gera meses de dados sinteticos (dezenas de segundos)",
]
